  <rect x="294" y="172" width="12" height="10" fill="#D4A62A"/>
  <rect x="276" y="226" width="48" height="12" rx="3" fill="#D4A62A"/>
  <circle cx="370" cy="270" r="8" fill="#D4A62A"/>
  <!-- geranium pots -->
