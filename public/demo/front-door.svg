    <path d="M90 330 H170 L160 400 H100 Z" fill="#C0582F"/>
    <rect x="84" y="320" width="92" height="16" rx="4" fill="#A9481F"/>
    <g fill="#2F7A3A"><circle cx="110" cy="300" r="22"/><circle cx="150" cy="300" r="22"/><circle cx="130" cy="285" r="22"/></g>
    <g fill="#E0262B"><circle cx="108" cy="282" r="12"/><circle cx="148" cy="278" r="12"/><circle cx="130" cy="262" r="13"/></g>
  </g>
  <g>
    <path d="M430 330 H510 L500 400 H440 Z" fill="#C0582F"/>
    <rect x="424" y="320" width="92" height="16" rx="4" fill="#A9481F"/>
    <g fill="#2F7A3A"><circle cx="450" cy="300" r="22"/><circle cx="490" cy="300" r="22"/><circle cx="470" cy="285" r="22"/></g>
    <g fill="#E0262B"><circle cx="448" cy="282" r="12"/><circle cx="488" cy="278" r="12"/><circle cx="470" cy="262" r="13"/></g>
