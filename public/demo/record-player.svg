<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#F3E6D2"/>
  <!-- wallpaper stripes -->
  <g fill="#EAD8BE"><rect x="0" width="40" height="300"/><rect x="80" width="40" height="300"/><rect x="160" width="40" height="300"/><rect x="240" width="40" height="300"/><rect x="320" width="40" height="300"/><rect x="400" width="40" height="300"/><rect x="480" width="40" height="300"/><rect x="560" width="40" height="300"/></g>
  <!-- sideboard -->
  <rect x="40" y="300" width="520" height="24" rx="6" fill="#7A5236"/>
  <rect x="60" y="324" width="480" height="126" fill="#8B6142"/>
  <rect x="80" y="340" width="210" height="96" rx="6" fill="#9C7150"/>
  <rect x="310" y="340" width="210" height="96" rx="6" fill="#9C7150"/>
  <circle cx="275" cy="388" r="6" fill="#D4A62A"/><circle cx="325" cy="388" r="6" fill="#D4A62A"/>
  <!-- record player case -->
  <rect x="110" y="190" width="380" height="110" rx="12" fill="#B33A2E"/>
  <rect x="122" y="200" width="356" height="90" rx="8" fill="#EFE7DA"/>
  <!-- record (drawn as an ellipse in perspective) -->
  <ellipse cx="270" cy="245" rx="120" ry="38" fill="#1F1B1A"/>
  <ellipse cx="270" cy="245" rx="92" ry="29" fill="none" stroke="#3A3432" stroke-width="3"/>
  <ellipse cx="270" cy="245" rx="66" ry="21" fill="none" stroke="#3A3432" stroke-width="3"/>
  <ellipse cx="270" cy="245" rx="30" ry="10" fill="#E8A33D"/>
  <ellipse cx="270" cy="245" rx="4" ry="2" fill="#1F1B1A"/>
  <!-- tone arm -->
  <circle cx="430" cy="222" r="14" fill="#9AA4AE"/>
  <path d="M430 222 L372 262 L346 258" fill="none" stroke="#9AA4AE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="336" y="252" width="16" height="10" rx="2" fill="#5F6770"/>
  <!-- knobs -->
  <circle cx="440" cy="272" r="8" fill="#5F6770"/><circle cx="462" cy="272" r="8" fill="#5F6770"/>
  <!-- music notes floating up -->
  <g fill="#1B4F9C">
    <ellipse cx="200" cy="140" rx="12" ry="9"/><rect x="209" y="88" width="5" height="52"/><path d="M214 88 q20 6 18 26 q-4 -14 -18 -14 z"/>
    <ellipse cx="330" cy="110" rx="12" ry="9"/><ellipse cx="370" cy="100" rx="12" ry="9"/>
    <rect x="339" y="60" width="5" height="50"/><rect x="379" y="50" width="5" height="50"/>
    <path d="M339 60 L384 50 L384 62 L339 72 Z"/>
  </g>
  <!-- record sleeve leaning -->
  <rect x="470" y="220" width="70" height="80" rx="3" fill="#2F7A4A" transform="rotate(8 505 260)"/>
  <circle cx="505" cy="258" r="20" fill="#F2B705" transform="rotate(8 505 260)"/>
</svg>
